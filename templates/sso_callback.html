<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/static/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Signing In...</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="mx-auto max-w-lg px-4 py-10">
      <div class="rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-full bg-blue-100"></div>
          <div>
            <div class="text-sm font-semibold text-slate-800">Completing sign-in</div>
            <div class="text-xs text-slate-600">Verifying your SSO session...</div>
          </div>
        </div>

        <div id="statusLine" class="mt-4 text-sm text-slate-700">Please wait.</div>
        <pre id="debugOut" class="mt-4 hidden overflow-x-auto rounded-lg bg-slate-900 p-4 text-xs text-slate-100"></pre>
      </div>
    </div>

    <script>
      const SSO_BASE = {{ sso_base_url|tojson }};
      const statusLine = document.getElementById('statusLine');
      const debugOut = document.getElementById('debugOut');

      fetch(`${SSO_BASE}/api/v1/verify-session`, {
        method: 'GET',
        credentials: 'include'
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`SSO verify failed (${response.status})`);
          }
          return response.json();
        })
        .then((data) => {
          debugOut.classList.remove('hidden');
          debugOut.textContent = JSON.stringify(data, null, 2);

          if (!data || !data.authenticated || !data.user) {
            sessionStorage.removeItem('hrClearanceProvider');
            window.location.href = '/login';
            return null;
          }

          statusLine.textContent = 'Creating app session...';
          const provider = sessionStorage.getItem('hrClearanceProvider') || 'sso';

          return fetch('/auth/sso/complete', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ ...data.user, provider })
          });
        })
        .then((response) => {
          if (!response) return null;
          if (!response.ok) {
            throw new Error(`App session failed (${response.status})`);
          }
          return response.json();
        })
        .then((data) => {
          if (data === null) return;
          sessionStorage.removeItem('hrClearanceProvider');
          statusLine.textContent = 'Redirecting...';
          window.location.href = '/';
        })
        .catch(() => {
          sessionStorage.removeItem('hrClearanceProvider');
          window.location.href = '/login';
        });
    </script>
  </body>
</html>
