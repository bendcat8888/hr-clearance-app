<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/static/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>HR Login</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10">
      <div class="w-full rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <div class="mb-6 flex items-center gap-3">
          <img src="/static/img/InnoGen.png" alt="InnoGen" class="h-10 w-auto" />
          <div>
            <div class="text-sm font-semibold text-slate-800">HR Clearance</div>
            <div class="text-xs text-slate-600">HR Authentication</div>
          </div>
        </div>

        {% if error %}
          <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">{{ error }}</div>
        {% endif %}
        {% if message %}
          <div class="mb-4 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">{{ message }}</div>
        {% endif %}

        <form method="post" action="/hr/login" class="space-y-4">
          <input type="hidden" name="next" value="{{ next }}" />
          <label class="block text-xs font-semibold text-slate-900">
            USERNAME
            <input name="username" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
          </label>
          <label class="block text-xs font-semibold text-slate-900">
            PASSWORD
            <input type="password" name="password" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
          </label>
          <button type="submit" class="w-full rounded-md bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Sign in</button>
        </form>
        <form method="post" action="/hr/forgot-password" class="mt-3">
          <input type="hidden" name="next" value="{{ next }}" />
          <button type="submit" class="w-full rounded-md bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50">Forgot Password</button>
        </form>
        <div class="mt-4 text-center">
          <a href="/" class="text-sm font-semibold text-slate-700 hover:underline">Back to Create Form</a>
        </div>
      </div>
    </div>
  </body>
</html>
